name: Build deploy zips

# Push to main  -> build + auto-deploy to STAGING over FTPS.
# Run workflow  -> choose staging or production (production is manual only).
# Production = the main-site build (address goldenagewisdom.org/), uploaded to <site>/app/
# (served at goldenagewisdom.org since Admin → Go live). Frontend only: both builds use the one
# backend at /staging/backend, which the staging deploy uploads.
# Deploy steps are skipped until the FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
# repo secrets exist. Optional repo variables: FTP_ROOT (default
# public_html/goldenagewisdom.org/), FTP_PROTOCOL (default ftps).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which frontend build"
        type: choice
        options: [staging, production]
        default: staging

# One deploy at a time per target. Only staging uploads the backend (shared by both), so a
# production build and a staging deploy never write the same folder and can run side by side —
# and a waiting production build no longer replaces (cancels) a waiting staging deploy.
concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.target || 'staging' }}
  FTP_SERVER: ${{ secrets.FTP_SERVER }}
  FTP_ROOT: ${{ vars.FTP_ROOT || 'public_html/goldenagewisdom.org/' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Configure target
        working-directory: frontend
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "VITE_API_URL=https://goldenagewisdom.org/staging/backend/api/v1" > .env.production
            sed -i -E "s#base: '[^']*'#base: '/'#" vite.config.js
          else
            echo "VITE_API_URL=https://goldenagewisdom.org/staging/backend/api/v1" > .env.production
          fi
          echo "Building for $TARGET"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cp deploy/htaccess-frontend frontend/dist/.htaccess
      - name: Version stamp and staging noindex
        # version.json lets Admin → Go live tell whether the production build matches staging.
        # The staging copy stays online after go-live, so keep search engines off it.
        run: |
          printf '{"sha":"%s","built_at":"%s","target":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TARGET" > frontend/dist/version.json
          if [ "$TARGET" != "production" ]; then
            sed -i 's#<head>#<head><meta name="robots" content="noindex">#' frontend/dist/index.html
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.event.inputs.target || 'staging' }}
          path: frontend/dist
          include-hidden-files: true
      - name: Resolve server folder
        if: env.FTP_SERVER != ''
        working-directory: frontend
        run: |
          # Staging: the folder the build was made for (vite `base`). Production: app/, beside the
          # old site, never over it — the go-live switch points the site at it.
          if [ "$TARGET" = "production" ]; then
            echo "SERVER_DIR=${FTP_ROOT%/}/app/" >> "$GITHUB_ENV"
          else
            BASE=$(grep -oE "base: '[^']*'" vite.config.js | sed -E "s/base: '(.*)'/\1/")
            echo "SERVER_DIR=${FTP_ROOT%/}/${BASE#/}" >> "$GITHUB_ENV"
          fi
      - name: Deploy frontend to cPanel (${{ env.TARGET }})
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: frontend/dist/
          server-dir: ${{ env.SERVER_DIR }}

  backend:
    # The live site uses the staging backend; every staging deploy (each merge to main) uploads it.
    if: ${{ (github.event.inputs.target || 'staging') != 'production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", tools: composer:v2 }
      - run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend
      - run: cp deploy/htaccess-backend-root backend/.htaccess
      - name: Strip local-only files
        run: rm -rf backend/tests backend/node_modules backend/.env backend/storage/logs/*.log
      - name: Keep Laravel's empty working folders
        # FTP only creates folders that hold a file, and Laravel's own
        # placeholders are .gitignore files (excluded below). Without these the
        # app fails with "Please provide a valid cache path". The files must not be
        # empty: the FTPS server drops the connection on zero-byte uploads.
        run: |
          for d in storage/framework/cache/data storage/framework/sessions storage/framework/views \
                   storage/logs storage/app/public storage/app/private bootstrap/cache; do
            mkdir -p "backend/$d" && echo "Keeps this folder on the server (FTP skips empty folders)." > "backend/$d/.deploy-keep"
          done
      - name: Pack vendor/ as one zip
        # vendor/ is thousands of files; FTP sends them one by one (an hour+ for one new
        # SDK). It goes up as vendor.zip instead and is swapped in on the server with
        # `bash unpack-vendor.sh`. Fixed timestamps + sorted entries make the zip
        # byte-identical while composer.lock is unchanged, so FTP skips re-uploading it.
        run: |
          tmp=$(mktemp -d)
          cp -a backend/vendor "$tmp/vendor-new"
          find "$tmp/vendor-new" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd "$tmp" && find vendor-new \( -type f -o -type l \) | LC_ALL=C sort | TZ=UTC zip -q -X -y -D -@ "$GITHUB_WORKSPACE/backend/vendor.zip")
          cp deploy/unpack-vendor.sh backend/unpack-vendor.sh
          ls -lh backend/vendor.zip
      - name: Did the PHP libraries change?
        run: |
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null \
             && git diff --quiet "$before" HEAD -- backend/composer.lock; then
            echo "PHP libraries unchanged — nothing to do on the server for vendor/." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### PHP libraries changed (or unknown)" >> "$GITHUB_STEP_SUMMARY"
            echo 'After this deploy, run in the cPanel terminal: `cd <backend folder> && bash unpack-vendor.sh`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend
          include-hidden-files: true
      - name: Resolve server folder
        if: env.FTP_SERVER != ''
        run: |
          # One backend for staging and the live site (it holds the real data).
          echo "SERVER_DIR=${FTP_ROOT%/}/staging/backend/" >> "$GITHUB_ENV"
      - name: Deploy backend to cPanel (${{ env.TARGET }})
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/
          server-dir: ${{ env.SERVER_DIR }}
          # Never touch the server's .env. Runtime files under storage/ are
          # created on the server, never uploaded, so the action leaves them be;
          # only the .deploy-keep placeholders go up from there.
          exclude: |
            **/.git*
            **/.git*/**
            .env
            vendor/**
