name: Build deploy zips

# Push to main  -> build + auto-deploy to STAGING over FTPS.
# Run workflow  -> choose staging or production (production is manual only).
# Deploy steps are skipped until the FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
# repo secrets exist. Optional repo variables: FTP_ROOT (default
# public_html/goldenagewisdom.org/), FTP_PROTOCOL (default ftps).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which frontend build"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.target || 'staging' }}
  FTP_SERVER: ${{ secrets.FTP_SERVER }}
  FTP_ROOT: ${{ vars.FTP_ROOT || 'public_html/goldenagewisdom.org/' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Configure target
        working-directory: frontend
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "VITE_API_URL=https://goldenagewisdom.org/backend/api/v1" > .env.production
            sed -i -E "s#base: '[^']*'#base: '/'#" vite.config.js
          else
            echo "VITE_API_URL=https://goldenagewisdom.org/staging/backend/api/v1" > .env.production
          fi
          echo "Building for $TARGET"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cp deploy/htaccess-frontend frontend/dist/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.event.inputs.target || 'staging' }}
          path: frontend/dist
          include-hidden-files: true
      - name: Resolve server folder
        if: env.FTP_SERVER != ''
        working-directory: frontend
        run: |
          # Upload to the folder the build was made for (vite `base`).
          BASE=$(grep -oE "base: '[^']*'" vite.config.js | sed -E "s/base: '(.*)'/\1/")
          echo "SERVER_DIR=${FTP_ROOT%/}/${BASE#/}" >> "$GITHUB_ENV"
      - name: Deploy frontend to cPanel (${{ env.TARGET }})
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: frontend/dist/
          server-dir: ${{ env.SERVER_DIR }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", tools: composer:v2 }
      - run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend
      - run: cp deploy/htaccess-backend-root backend/.htaccess
      - name: Strip local-only files
        run: rm -rf backend/tests backend/node_modules backend/.env backend/storage/logs/*.log
      - name: Keep Laravel's empty working folders
        # FTP only creates folders that hold a file, and Laravel's own
        # placeholders are .gitignore files (excluded below). Without these the
        # app fails with "Please provide a valid cache path".
        run: |
          for d in storage/framework/cache/data storage/framework/sessions storage/framework/views \
                   storage/logs storage/app/public storage/app/private bootstrap/cache; do
            mkdir -p "backend/$d" && touch "backend/$d/.deploy-keep"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend
          include-hidden-files: true
      - name: Resolve server folder
        if: env.FTP_SERVER != ''
        run: |
          if [ "$TARGET" = "production" ]; then SUB=backend/; else SUB=staging/backend/; fi
          echo "SERVER_DIR=${FTP_ROOT%/}/$SUB" >> "$GITHUB_ENV"
      - name: Deploy backend to cPanel (${{ env.TARGET }})
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: backend/
          server-dir: ${{ env.SERVER_DIR }}
          # Never touch the server's .env. Runtime files under storage/ are
          # created on the server, never uploaded, so the action leaves them be;
          # only the .deploy-keep placeholders go up from there.
          exclude: |
            **/.git*
            **/.git*/**
            .env
