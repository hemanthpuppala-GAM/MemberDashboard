<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F7F1E3;font-family:'Manrope',sans-serif;color:#15120E;-webkit-font-smoothing:antialiased}
a{color:#7A5E22;text-decoration:none}a:hover{color:#15120E}
input,select,textarea{font:inherit;color:#15120E;background:#FFFDF8;border:1px solid rgba(138,111,52,.35);border-radius:10px;padding:10px 12px;outline:none;width:100%;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:#C9A24A;box-shadow:0 0 0 3px rgba(201,162,74,.25)}
button{font:inherit;cursor:pointer}
::selection{background:#E8CF83;color:#0B0A0A}
</style>
</helmet>

<main style="max-width:980px;margin:0 auto;padding:clamp(24px,4vw,56px) clamp(20px,4vw,40px) 120px;display:flex;flex-direction:column;gap:32px">
  <header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid rgba(138,111,52,.35)">
    <div style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#7A5E22">Admin · Mission page</p>
      <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(32px,4vw,44px);line-height:1;letter-spacing:-.01em">Story, yugas &amp; the 8% goal</h1>
      <p style="margin:0;font-size:14px;color:#3A3128">Changes publish to the Mission page the moment you save. <a href="Mission.dc.html" target="_blank">Open the Mission page ↗</a> · <a href="Admin Home.dc.html">Home</a> · <a href="Admin About.dc.html">About</a></p>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:{{ statusColor }};min-width:120px;text-align:right">{{ status }}</span>
      <button onClick="{{ reset }}" style="height:40px;padding:0 18px;border-radius:999px;border:1px solid rgba(138,111,52,.45);background:transparent;color:#15120E;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">Reset to file</button>
      <button onClick="{{ save }}" style="height:40px;padding:0 22px;border-radius:999px;border:0;background:#0B0A0A;color:#F6F1E6;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 22px rgba(11,10,10,.22)" style-hover="color:#E8CF83">Save &amp; publish</button>
    </div>
  </header>

  <section style="display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:22px;background:rgba(255,253,248,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 40px -14px rgba(60,42,16,.2)">
    <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7A5E22">Heading</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Eyebrow</span><input type="text" data-k="eyebrow" value="{{ c.eyebrow }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Title</span><input type="text" data-k="title" value="{{ c.title }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Title accent (italic)</span><input type="text" data-k="titleAccent" value="{{ c.titleAccent }}" onChange="{{ setText }}"></label>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:22px;background:rgba(255,253,248,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 40px -14px rgba(60,42,16,.2)">
    <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7A5E22">Story</p>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Paragraph 1</span><textarea rows="3" data-k="intro1" value="{{ c.intro1 }}" onChange="{{ setText }}" style="resize:vertical"></textarea></label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Paragraph 1 · highlighted phrase</span><input type="text" data-k="intro1Accent" value="{{ c.intro1Accent }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Paragraph 1 · closing line</span><input type="text" data-k="intro1Tail" value="{{ c.intro1Tail }}" onChange="{{ setText }}"></label>
    </div>
    <p style="margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7A5E22">The four yugas</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ yugas }}" as="y" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,3fr);gap:10px;padding:12px;border-radius:14px;background:#FFFDF8;border:1px solid rgba(138,111,52,.2)">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;color:#6B5E48"><span>Name</span><input type="text" data-i="{{ $index }}" data-k="name" value="{{ y.name }}" onChange="{{ setYuga }}"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:600;color:#6B5E48"><span>Description</span><input type="text" data-i="{{ $index }}" data-k="tag" value="{{ y.tag }}" onChange="{{ setYuga }}"></label>
        </div>
      </sc-for>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128;margin-top:6px"><span>Paragraph 2</span><textarea rows="3" data-k="intro2" value="{{ c.intro2 }}" onChange="{{ setText }}" style="resize:vertical"></textarea></label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128;max-width:420px"><span>Paragraph 2 · highlighted phrase</span><input type="text" data-k="intro2Accent" value="{{ c.intro2Accent }}" onChange="{{ setText }}"></label>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:22px;background:rgba(255,253,248,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 40px -14px rgba(60,42,16,.2)">
    <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7A5E22">The 8% goal card</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Big number (without %)</span><input type="text" data-k="goalNumber" value="{{ c.goalNumber }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Lead-in</span><input type="text" data-k="goalLead" value="{{ c.goalLead }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Highlighted phrase</span><input type="text" data-k="goalAccent" value="{{ c.goalAccent }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Closing</span><input type="text" data-k="goalTail" value="{{ c.goalTail }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Dots caption</span><input type="text" data-k="dotsCaption" value="{{ c.dotsCaption }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Button label</span><input type="text" data-k="cta" value="{{ c.cta }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Button link</span><input type="text" data-k="ctaHref" value="{{ c.ctaHref }}" onChange="{{ setText }}"></label>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:22px;background:rgba(255,253,248,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 40px -14px rgba(60,42,16,.2)">
    <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7A5E22">Footer band</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Title</span><input type="text" data-k="footerTitle" value="{{ c.footerTitle }}" onChange="{{ setText }}"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3A3128"><span>Sub-line</span><input type="text" data-k="footerSub" value="{{ c.footerSub }}" onChange="{{ setText }}"></label>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static KEY = 'gaw:mission-content:v1';
  state = { c: null, file: null, status: 'Loading…', dirty: false };
  componentDidMount() {
    fetch('content/mission.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => {
      let c = j; try { const o = localStorage.getItem(Component.KEY); if (o) c = { ...j, ...JSON.parse(o) }; } catch {}
      this.setState({ file: j, c: JSON.parse(JSON.stringify(c)), status: localStorage.getItem(Component.KEY) ? 'Published overrides active' : 'Showing file defaults' });
    });
  }
  patch(fn) { this.setState(s => { const c = JSON.parse(JSON.stringify(s.c)); fn(c); return { c, dirty: true, status: 'Unsaved changes' }; }); }
  renderVals() {
    const c = this.state.c || { yugas: [] };
    return {
      c, yugas: c.yugas || [],
      setText: (e) => { const k = e.target.dataset.k, v = e.target.value; this.patch(c => { c[k] = v; }); },
      setYuga: (e) => { const i = +e.target.dataset.i, k = e.target.dataset.k, v = e.target.value; this.patch(c => { c.yugas[i][k] = v; }); },
      status: this.state.status, statusColor: this.state.dirty ? '#A8403F' : '#6B5E48',
      save: () => { try { localStorage.setItem(Component.KEY, JSON.stringify(this.state.c)); this.setState({ dirty: false, status: 'Published ✓' }); } catch { this.setState({ status: 'Could not save' }); } },
      reset: () => { localStorage.removeItem(Component.KEY); this.setState({ c: JSON.parse(JSON.stringify(this.state.file)), dirty: false, status: 'Reset to file defaults' }); }
    };
  }
}
</script>
</body>
</html>
